<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPS2390 练习</title>
<script>
const id = location.hash.match(/^#(a5|ps3)-(\d+)$/);
const source = location.hash === '#assignment-5' ? 'assignment' :
  location.hash === '#problem-set-3' ? 'problemset' : '';
const params = new URLSearchParams();
if (id) params.set('q', id[1].toUpperCase() + '-' + id[2].padStart(2, '0'));
else if (source) params.set('source', source);
location.replace('index.html' + (params.size ? '?' + params : ''));
</script>
</head>
<body><a href="index.html">打开 CPS2390 练习</a></body>
</html>
